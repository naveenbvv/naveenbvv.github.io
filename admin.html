<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Private Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#fafafa" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafafa;
      --bg-soft: #f1f1f3;
      --card: #ffffff;
      --border: rgba(15, 15, 20, 0.09);
      --border-strong: rgba(15, 15, 20, 0.18);
      --text: #141419;
      --text-dim: #4b4b55;
      --text-faint: #8a8a95;
      --accent: #4f5dd5;
      --accent-soft: rgba(79, 93, 213, 0.09);
      --green: #15803d;
      --red: #b91c1c;
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: "SF Mono", "JetBrains Mono", "Fira Code", Consolas, monospace;
      --radius: 12px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow: 0 1px 2px rgba(15,15,20,0.04), 0 8px 28px -12px rgba(15,15,20,0.10);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    ::selection { background: var(--accent-soft); }
    a { color: var(--accent); }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .container { width: min(100% - 40px, 860px); margin-inline: auto; }

    /* ---- Lock screen ---- */
    #lock-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
    }
    .lock-card {
      background: var(--card);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 48px 44px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .lock-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--accent-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      margin-bottom: 20px;
    }
    .lock-icon svg { width: 24px; height: 24px; }
    .lock-card h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .lock-card p { color: var(--text-dim); font-size: 0.92rem; margin-bottom: 28px; }
    .lock-card input {
      width: 100%;
      font-family: var(--font);
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 13px 16px;
      margin-bottom: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .lock-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); outline: none; }
    .lock-card .error { color: var(--red); font-size: 0.85rem; min-height: 22px; margin-bottom: 12px; }
    .lock-card button {
      width: 100%;
      font-family: var(--font);
      font-size: 0.98rem;
      font-weight: 650;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s var(--ease);
    }
    .lock-card button:hover { background: #5f6ee5; transform: translateY(-1px); }
    .lock-card .back-link { display: inline-block; margin-top: 20px; font-size: 0.85rem; color: var(--text-faint); }

    /* ---- Admin ---- */
    #admin-screen { display: none; }
    header.admin-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250,250,250,0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .admin-nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      width: min(100% - 40px, 1120px);
      margin-inline: auto;
    }
    .admin-title { font-weight: 700; font-size: 1rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; }
    .admin-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .admin-actions { display: flex; gap: 10px; }
    .btn-sm {
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 15px;
      border-radius: 9px;
      border: 1px solid var(--border-strong);
      background: var(--card);
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, transform 0.2s var(--ease);
    }
    .btn-sm:hover { color: var(--text); border-color: rgba(15,15,20,0.3); transform: translateY(-1px); }

    main { padding: 56px 0 90px; }
    .page-head { margin-bottom: 32px; }
    .page-head h2 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 750; letter-spacing: -0.03em; margin-bottom: 6px; }
    .page-head p { color: var(--text-dim); font-size: 0.95rem; }
    .count-badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.75rem;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 100px;
      padding: 3px 12px;
      margin-left: 10px;
      vertical-align: middle;
    }

    .msg-list { display: flex; flex-direction: column; gap: 14px; }
    .msg-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      box-shadow: var(--shadow);
      transition: border-color 0.25s;
    }
    .msg-card:hover { border-color: var(--border-strong); }
    .msg-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 10px; }
    .msg-name { font-weight: 650; font-size: 1rem; }
    .msg-email { color: var(--accent); font-size: 0.88rem; font-family: var(--mono); word-break: break-all; }
    .msg-cat {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 3px 10px;
    }
    .msg-date { margin-left: auto; color: var(--text-faint); font-size: 0.78rem; font-family: var(--mono); }
    .msg-body { color: var(--text-dim); font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
    .msg-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
    .msg-actions a, .msg-actions button {
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--card);
      color: var(--text-dim);
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .msg-actions a:hover, .msg-actions button:hover { color: var(--text); border-color: rgba(15,15,20,0.3); }
    .msg-actions .danger:hover { color: var(--red); border-color: rgba(220,38,38,0.35); }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-faint);
    }
    .empty-state .big { font-size: 1.15rem; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
    .empty-state p { font-size: 0.9rem; }

    .loading-state, .error-state { text-align: center; padding: 80px 20px; color: var(--text-faint); font-family: var(--mono); font-size: 0.9rem; }
    .error-state { color: var(--red); }

    footer { border-top: 1px solid var(--border); padding: 28px 0; }
    .footer-inner { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
    .footer-inner .note { color: var(--text-faint); font-size: 0.78rem; font-family: var(--mono); }

    @media (max-width: 600px) {
      .lock-card { padding: 36px 26px; }
      .msg-date { margin-left: 0; width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <!-- ============ LOCK SCREEN ============ -->
  <div id="lock-screen">
    <div class="container">
      <div class="lock-card">
        <span class="lock-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <h1>Private Messages</h1>
        <p>Enter your password to view messages from your contact form.</p>
        <form id="lock-form">
          <input type="password" id="lock-input" placeholder="Password" autocomplete="current-password" aria-label="Admin password" />
          <p class="error" id="lock-error"></p>
          <button type="submit">Unlock</button>
        </form>
        <a class="back-link" href="index.html">← Back to portfolio</a>
      </div>
    </div>
  </div>

  <!-- ============ ADMIN SCREEN ============ -->
  <div id="admin-screen">
    <header class="admin-nav">
      <div class="admin-nav-inner">
        <span class="admin-title"><span class="dot" aria-hidden="true"></span>Messages</span>
        <div class="admin-actions">
          <button class="btn-sm" id="refresh-btn">Refresh</button>
          <button class="btn-sm" id="logout-btn">Lock</button>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="page-head">
          <h2>Contact form messages<span class="count-badge" id="msg-count">0</span></h2>
          <p>Messages submitted through your contact page, stored in Supabase.</p>
        </div>
        <div id="msg-container">
          <p class="loading-state">Loading messages…</p>
        </div>
      </div>
    </main>

    <footer>
      <div class="container footer-inner">
        <span class="note">Private page — not linked from your public site</span>
        <span class="note">© 2026 Naveen B V</span>
      </div>
    </footer>
  </div>

  <script>
    (function () {
      "use strict";

      /* ================= CONFIG ================= */
      var SUPABASE_URL = "https://aphjgfxjtmtektxovytk.supabase.co";
      var SUPABASE_KEY = "sb_publishable_ITyabgRmeuQ5YFUhQX6l4g_Kr7J53Ne";
      var ADMIN_PASSWORD = "KP";   // ← your admin password

      var lockScreen = document.getElementById("lock-screen");
      var adminScreen = document.getElementById("admin-screen");
      var lockForm = document.getElementById("lock-form");
      var lockInput = document.getElementById("lock-input");
      var lockError = document.getElementById("lock-error");
      var msgContainer = document.getElementById("msg-container");
      var msgCount = document.getElementById("msg-count");

      /* ---- Session (kept in memory only — cleared on refresh/close) ---- */
      var unlocked = false;

      lockForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (lockInput.value === ADMIN_PASSWORD) {
          unlocked = true;
          lockError.textContent = "";
          lockScreen.style.display = "none";
          adminScreen.style.display = "block";
          loadMessages();
        } else {
          lockError.textContent = "Incorrect password. Try again.";
          lockInput.value = "";
          lockInput.focus();
        }
      });

      document.getElementById("logout-btn").addEventListener("click", function () {
        unlocked = false;
        adminScreen.style.display = "none";
        lockScreen.style.display = "flex";
        lockInput.value = "";
        lockInput.focus();
      });

      document.getElementById("refresh-btn").addEventListener("click", loadMessages);

      function esc(str) {
        return String(str == null ? "" : str)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      function fmtDate(iso) {
        try {
          return new Date(iso).toLocaleString("en-IN", {
            day: "numeric", month: "short", year: "numeric",
            hour: "2-digit", minute: "2-digit"
          });
        } catch (e) { return String(iso).slice(0, 10); }
      }

      async function loadMessages() {
        if (!unlocked) return;
        msgContainer.innerHTML = '<p class="loading-state">Loading messages…</p>';
        try {
          var res = await fetch(
            SUPABASE_URL + "/rest/v1/messages?select=*&order=created_at.desc",
            {
              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
              }
            }
          );
          if (!res.ok) {
            var errText = await res.text();
            throw new Error(res.status + " " + errText);
          }
          var messages = await res.json();
          renderMessages(messages);
        } catch (err) {
          console.error(err);
          msgContainer.innerHTML =
            '<div class="error-state">Could not load messages.<br/>' +
            'Make sure the <code>messages</code> table exists in Supabase (run the SQL query from the setup steps).<br/><br/>' +
            esc(err.message) + "</div>";
        }
      }

      function renderMessages(messages) {
        msgCount.textContent = messages.length;
        if (!messages.length) {
          msgContainer.innerHTML =
            '<div class="empty-state">' +
            '<p class="big">No messages yet</p>' +
            "<p>When someone fills out your contact form, their message appears here.</p>" +
            "</div>";
          return;
        }

        var list = document.createElement("div");
        list.className = "msg-list";

        messages.forEach(function (m) {
          var card = document.createElement("article");
          card.className = "msg-card";

          var top = document.createElement("div");
          top.className = "msg-top";

          var name = document.createElement("span");
          name.className = "msg-name";
          name.textContent = m.name || "Unknown";

          var email = document.createElement("a");
          email.className = "msg-email";
          email.href = "mailto:" + (m.email || "");
          email.textContent = m.email || "";

          var cat = document.createElement("span");
          cat.className = "msg-cat";
          cat.textContent = m.category || "Other";

          var date = document.createElement("span");
          date.className = "msg-date";
          date.textContent = fmtDate(m.created_at);

          top.appendChild(name);
          top.appendChild(email);
          top.appendChild(cat);
          top.appendChild(date);

          var body = document.createElement("p");
          body.className = "msg-body";
          body.textContent = m.message || "";

          var actions = document.createElement("div");
          actions.className = "msg-actions";

          var reply = document.createElement("a");
          reply.href = "mailto:" + (m.email || "") +
            "?subject=" + encodeURIComponent("Re: " + (m.category || "Message") + " from your portfolio") +
            "&body=" + encodeURIComponent("Hi " + (m.name || "") + ",\n\n");
          reply.textContent = "Reply";

          var del = document.createElement("button");
          del.className = "danger";
          del.type = "button";
          del.textContent = "Delete";
          del.addEventListener("click", function () {
            if (!confirm("Delete this message from " + (m.name || "unknown") + "?")) return;
            deleteMessage(m.id, card);
          });

          actions.appendChild(reply);
          actions.appendChild(del);

          card.appendChild(top);
          card.appendChild(body);
          card.appendChild(actions);
          list.appendChild(card);
        });

        msgContainer.innerHTML = "";
        msgContainer.appendChild(list);
      }

      async function deleteMessage(id, cardEl) {
        try {
          var res = await fetch(SUPABASE_URL + "/rest/v1/messages?id=eq." + id, {
            method: "DELETE",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY
            }
          });
          if (res.ok) {
            cardEl.style.opacity = "0.4";
            cardEl.style.textDecoration = "line-through";
            setTimeout(loadMessages, 400);
          } else {
            alert("Could not delete message. Check that your Supabase policies allow DELETE, or delete it from the Supabase dashboard (Table Editor → messages).");
          }
        } catch (err) {
          console.error(err);
          alert("Could not delete message (network error).");
        }
      }
    })();
  </script>
</body>
</html>
